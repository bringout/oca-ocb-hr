[project]
name = "odoo-bringout-oca-ocb-hr_homeworking_calendar"
version = "19.0.0"
description = "hr_homeworking_calendar - Odoo addon (upstream OCB 19.0, added for v16->v19 migration completeness)"
authors = [
    { name = "Ernad Husremovic", email = "hernad@bring.out.ba" }
]
readme = "README.md"
requires-python = ">= 3.11"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["hr_homeworking_calendar"]
