[project]
name = "odoo-bringout-oca-ocb-hr_work_entry_holidays"
version = "16.0.0"
description = "Time Off in Payslips - 
        Manage Time Off in Payslips
        "
authors = [
    { name = "Ernad Husremovic", email = "hernad@bring.out.ba" }
]
dependencies = [
    "odoo-bringout-oca-ocb-hr_holidays>=18.0.0",
    "TODO_MAP-hr_holidays_contract>=18.0.0",
    "odoo-bringout-oca-ocb-hr_work_entry_contract>=18.0.0",
    "requests>=2.25.1"
]
readme = "README.md"
requires-python = ">= 3.11"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU Lesser General Public License v3 (LGPLv3)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business",
]

[project.urls]
homepage = "https://git.hodi.ba/bringout/project-0"
repository = "https://git.hodi.ba/bringout/project-0"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["hr_work_entry_holidays"]

[tool.rye]
managed = true
dev-dependencies = [
    "pytest>=8.4.1",
]
